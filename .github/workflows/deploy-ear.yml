name: Deploy ear to Netlify

on:
  push:
    branches: [main]
    paths:
      - "netlify-ear/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ear
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b512caab2d2b6a7a5ea486e8c0b398 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4ea3a36737 # v4.1.0
        with:
          node-version: "22"

      - name: Install Netlify CLI
        run: npm i -g netlify-cli@17

      - name: Deploy the doorbell
        run: >
          netlify deploy
          --dir netlify-ear
          --functions netlify-ear/netlify/functions
          --site shopeefood-ear
          --prod
          --auth "${{ secrets.NETLIFY_AUTH_TOKEN }}"