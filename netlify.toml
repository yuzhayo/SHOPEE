[build]
  publish = "netlify-ear"

[functions]
  directory = "netlify-ear/netlify/functions"
  node_bundler = "esbuild"
  included_files = ["!**/*.txt"]

# Self-checked via Netlify API: plan = nf_team_dev (free team tier -> 10s cap).
# Keep exec/fetch below this; raise only if the account is upgraded to Pro.
[functions.ear]
  timeout = 10